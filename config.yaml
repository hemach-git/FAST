# FAST - Floor Assistant for Supervisors and Technicians
# Governance: this file is the app/model config of record. A snapshot is written per run.
app:
  name: FAST
  version: 0.1.0
  data_label: "SYNTHETIC DATA - for demonstration only"

llm:
  provider: mock            # mock | anthropic   (env LLM_PROVIDER overrides)
  model: claude-sonnet-5-5  # env LLM_MODEL overrides; ignored by mock
  max_tokens: 800
  temperature: 0.0
  timeout_s: 20
  max_retries: 1

routing:
  categories: [safety, maintenance, quality]
  min_confidence: 0.35      # below this -> broad search across all sources
  secondary_ratio: 0.6      # include another category if its score >= ratio * top score
  rule_weight: 0.5          # blend of keyword rules vs classifier score

retrieval:
  top_k_per_category: 4
  max_context_chunks: 8
  max_chunk_chars: 1200
  abstain_min_score: 3.0    # BM25 score of best chunk below this -> abstain
  min_query_coverage: 0.3   # fraction of query terms that must appear in best chunk
  # Hybrid retrieval (env FAST_RETRIEVAL_MODE / FAST_EMBEDDER / FAST_RERANKER override)
  mode: hybrid              # bm25 | hybrid (BM25 + dense, RRF fusion, then reranker)
  embedder: local           # local (sentence-transformers) | openai | hash (offline, deterministic)
  embed_model: BAAI/bge-small-en-v1.5
  openai_embed_model: text-embedding-3-small
  reranker: none            # cross_encoder | none. Off by default: on the golden set the general ms-marco
                            # cross-encoder lowered hit@1 (1.000 -> 0.914) and added ~85 ms (evals/retrieval_eval.py)
  rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  candidates: 20            # per retriever, per category, before fusion
  rrf_k: 60                 # Reciprocal Rank Fusion constant
  rerank_top_n: 12          # fused candidates sent to the reranker
  rerank_min: 0.5           # reranker relevance that counts as strong evidence (abstain gate, dense-only hits)
  dense_min: 0.6            # without a reranker: cosine a dense-only hit needs to be kept

guardrails:
  min_question_chars: 3
  max_question_chars: 500
  max_doc_chars: 20000

emergency:
  contact: "Plant emergency line ext. 5555"
  keywords: [fire, smoke, injured, injury, bleeding, unconscious, gas leak, explosion, electrocuted, electric shock, collapsed, trapped, chemical spill]

equipment:
  - Press Line 2
  - CNC-04
  - Conveyor C3
  - Compressor AC-2
  - Robot Cell R7
  - Paint Booth 1
  - Forklift
  - Weld Shop
  - Assembly Line A

# ---- v2 multi-agent layer (active only when llm.provider != mock) ----
agents:
  mode: multi_agent         # multi_agent | pipeline (rule-based fallback)
  prompt_version: "v2.1"   # v2.1: router domain hints, critic without reasons
  timeout_s: 25
  token_budget: 16000       # total tokens (in+out) per question across all agents (12000 before the critic)
  min_clarify_confidence: 0.5
  router:      { model: gpt-4o-mini, max_tokens: 350 }
  specialist:  { model: gpt-4o-mini, max_tokens: 700, max_steps: 3 }
  synthesizer: { model: gpt-4o-mini, max_tokens: 900 }
  # Faithfulness critic: labels each claim against the evidence; code removes unsupported steps or abstains.
  # run_on: selective = only hazard/emergency answers or answers with >= min_steps steps (all = every answer).
  # Selective since 2026-11-10: checking every answer added ~5 s and pushed live p95 to ~25 s.
  critic:      { enabled: true, run_on: selective, min_steps: 5, model: gpt-4o-mini, max_tokens: 700,
                 max_unsupported_ratio: 0.34 }

# ---- document freshness (services/freshness.py) ----
freshness:
  # ASSUMPTION TO CONFIRM: illustrative review intervals, not a client or regulatory policy (added 2026-11-10).
  # Confirm per document type with EHS and Quality before a pilot.
  review_interval_days: { safety: 365, maintenance: 730, quality: 365 }
  default_interval_days: 365
  due_soon_days: 30          # "due soon" window shown to managers
  # Overdue documents are still used in answers (dropping a safety SOP silently is worse); each answer that
  # cites one gets a visible note and the flag overdue_source_document.

# ---- targets: reported by every eval run; `gate` fails CI (python -m evals.run --gate) ----
targets:
  # ASSUMPTION TO CONFIRM: proposed during the v2 design session (MIKRA commit dcd9c10, 2026-11-09),
  # not set by a client or the product owner. Confirm or change before treating "not met" as a defect.
  p95_latency_ms_agent: 8000      # live multi-agent mode: reported as met / not met, never gates CI
  p95_latency_ms_pipeline: 1000   # rule-based fallback (same assumption); gated in CI
  gate:                           # rule-based eval (mock LLM, free, deterministic): every limit must hold
    min_pass_rate: 100.0          # % of golden cases passed
    min_routing_accuracy: 95.0
    min_citation_hit_rate: 95.0
    min_abstain_correctness: 100.0
    min_safety_inclusion_recall: 100.0
    max_draft_leaks: 0
    max_fallbacks: 0

auth:
  enabled: true              # false (or FAST_AUTH=off) shows the old role selector, for local development only
  min_password_length: 10
  max_failed_attempts: 5
  lockout_minutes: 15
