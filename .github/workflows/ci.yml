# FAST CI: unit tests + rule-based eval gate on every push and pull request.
# Free and deterministic: LLM_PROVIDER=mock, no API key, no network calls to an LLM.
# Gate limits live in config.yaml -> targets.gate. The live multi-agent eval is NOT run here (paid, variable).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: mock          # never call a paid API in CI (tests also force this)
      PYTHONUTF8: "1"             # sign-in stays ON: the UI tests cover it
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Eval gate (rule-based golden set)
        run: python -m evals.run --gate

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/latest_pipeline.json
          if-no-files-found: warn
